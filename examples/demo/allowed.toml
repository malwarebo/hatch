schema_version = "1.0"
name = "allowed"
version = "0.1.0"
description = "Reaches an allowlisted host through the proxy"

[command]
program = "/usr/bin/curl"
args = ["-sS", "--max-time", "8", "-o", "/dev/null", "-w", "HTTP %{http_code}\n", "https://example.com"]

[network]
allow_https = ["example.com"]
allow_dns = ["example.com"]

[filesystem]
read = []
write = []
tmpfs = ["/tmp"]

[env]
passthrough = []

[exec]
allow_subprocess = false
allow_binaries = []

[resources]
memory_mb = 128
cpu_percent = 25
pids_max = 20
nofile = 64
tool_call_timeout_seconds = 30

[tool_policy]
require_approval = []
deny = []

[platform.linux]
seccomp_preset = "strict"
landlock = true

[platform.macos]
endpoint_security = false
